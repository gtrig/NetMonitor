# netmon configuration. ${VAR} references are expanded from the environment (.env).
listen: 0.0.0.0:8080        # NETMON_LISTEN overrides
# data_dir: /data           # NETMON_DATA_DIR overrides
# auth:                     # optional HTTP basic auth for the web UI
#   username: admin
#   password: ${NETMON_UI_PASSWORD}

# workers:
#   scans: 4                # how many scans run in parallel
#   detailed: 2             # how many of them may be detailed scans (must be lower)

routers:
  - name: core
    type: mikrotik
    address: 192.168.88.1:8729      # api-ssl; use :8728 with tls: false for plain API
    tls: true
    insecure_skip_verify: true      # RouterOS self-signed certificate
    username: netmon-ro
    password: ${CORE_PASS}

snmp_targets:
  - name: core-snmp
    address: 192.168.88.1
    version: v2c
    community: ${SNMP_COMMUNITY}

networks:
  - name: lan
    cidr: 192.168.88.0/24
    # exclude: [192.168.88.254]
    # offline_after: 15m   # default: a device is offline once no source saw it in its
    #                      # latest scan and one source has missed it for 3 of its intervals
    # auto_details: false  # do not scan new devices in detail automatically
    sources:
      - {type: router, ref: core, interval: 1m}
      - {type: snmp, ref: core-snmp, interval: 5m}
      - {type: nmap, interval: 15m}
      # - {type: ping, interval: 10s}   # fast presence; keep another source for devices that block ping

channels:
  - name: telegram
    type: telegram
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
  - name: discord
    type: discord
    webhook_url: ${DISCORD_WEBHOOK_URL}
  - name: email
    type: email
    smtp_host: smtp.example.com
    smtp_port: 587
    starttls: true
    username: netmon@example.com
    password: ${SMTP_PASSWORD}
    from: netmon@example.com
    to: [me@example.com]

rules:
  # New devices you have not marked as known.
  - events: [device_new, baseline]
    only_unknown: true
    channels: [telegram]
  # Anything suspicious goes everywhere.
  - events: [mac_changed_for_ip]
    channels: [telegram, discord, email]

# The MCP server of debug mode (also on Settings, or netmon -debug). Who may connect: without allow,
# only this machine. Every client also needs the token. With other networks here it listens on every address, port 8099.
# debug:
#   enabled: true
#   allow: [127.0.0.0/8, 192.168.8.0/24]
#   listen: 192.168.8.5:8099
