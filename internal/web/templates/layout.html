<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · netmon</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="{{.Active}}">
<header class="sticky top-0 z-5 flex items-center gap-3 overflow-x-auto border-b [scrollbar-width:none] bg-surface px-4 py-2.5 sm:gap-6 sm:px-6">
  <a class="flex items-center gap-2 font-bold text-fg" href="/"><span class="size-2.5 shrink-0 rounded-full bg-ok ring-3 ring-ok/25"></span>netmon</a>
  <nav class="flex gap-1">
    <a class="rounded-md px-2.5 py-1.5 text-muted aria-[current]:bg-page aria-[current]:text-fg" href="/" {{if eq .Active "dashboard"}}aria-current="page"{{end}}>Overview</a>
    <a class="rounded-md px-2.5 py-1.5 text-muted aria-[current]:bg-page aria-[current]:text-fg" href="/map" {{if eq .Active "map"}}aria-current="page"{{end}}>Map</a>
    <a class="rounded-md px-2.5 py-1.5 text-muted aria-[current]:bg-page aria-[current]:text-fg" href="/devices" {{if eq .Active "devices" "device"}}aria-current="page"{{end}}>Devices</a>
    <a class="rounded-md px-2.5 py-1.5 text-muted aria-[current]:bg-page aria-[current]:text-fg" href="/events" {{if eq .Active "events"}}aria-current="page"{{end}}>Events</a>
    <a class="rounded-md px-2.5 py-1.5 text-muted aria-[current]:bg-page aria-[current]:text-fg" href="/settings" {{if eq .Active "settings"}}aria-current="page"{{end}}>Settings</a>
  </nav>
</header>
<main class="{{if eq .Active "map"}}p-4 pb-0 sm:p-6 sm:pb-0{{else}}mx-auto max-w-[1400px] p-4 sm:p-6{{end}}">
{{template "content" .}}
</main>
<div id="toast" class="pointer-events-none fixed bottom-4 left-1/2 z-10 -translate-x-1/2 rounded-lg bg-fg px-3.5 py-2 text-page opacity-0 transition-opacity duration-200 data-show:opacity-100" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
{{block "scripts" .}}{{end}}
</body>
</html>
