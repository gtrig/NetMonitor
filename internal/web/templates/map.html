{{define "content"}}
<div class="map-bar">
  <h1>Network map</h1>
  <label>Network
    <select id="net">
      <option value="">All networks</option>
      {{range .Networks}}<option value="{{.Name}}" {{if eq $.Network .Name}}selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  <span class="legend"><i class="lg-router"></i>router <i class="lg-hop"></i>hop <i class="lg-online"></i>online <i class="lg-unknown"></i>unreviewed <i class="lg-offline"></i>offline</span>
  <button class="btn" id="relayout">Re-layout</button>
</div>
<div class="map-wrap">
  <div id="cy" aria-label="Network topology graph"></div>
  <aside id="panel" data-can-edit="{{.CanEdit}}" hidden></aside>
</div>
{{end}}
{{define "scripts"}}<script src="/static/cytoscape.min.js"></script><script src="/static/map.js"></script>{{end}}
