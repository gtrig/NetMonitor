{{define "content"}}
<div class="mb-3 flex flex-wrap items-center gap-4">
  <h1>Settings</h1>
  <span class="text-muted mono text-xs" id="cfgpath"></span>
  <span class="flex-1"></span>
  <button class="btn" id="reload" type="button">Reload from file</button>
  <button class="btn btn-primary" id="save" type="button" disabled>Save</button>
</div>
<div id="banner" class="banner" hidden>
  Settings are read-only because the web UI has no password. Add an <code>auth:</code> block
  (username and password) to <code>config.yaml</code> and restart to edit here.
</div>
<div id="errors" class="banner banner-bad" hidden role="alert"></div>
<div id="settings"><p class="text-muted">Loading…</p></div>
{{end}}
{{define "scripts"}}<script src="/static/settings.js"></script>{{end}}
